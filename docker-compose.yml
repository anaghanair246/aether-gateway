version: '3.8'
services:
  postgres:
    image: ankane/pgvector:v0.5.1
    environment:
      POSTGRES_USER: aether
      POSTGRES_PASSWORD: password
      POSTGRES_DB: aether_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
